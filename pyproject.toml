[project]
name = "landscape"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    # Security floor: fastapi only requires starlette>=0.46.0, which leaves the
    # CVE-affected starlette versions resolvable. Pin the fixed starlette directly.
    # 1.3.1 fixes the form-parse DoS + request.url.hostname poisoning advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "einops>=0.8",
    "openai>=1.50",
    "rich>=15.0",
    "tiktoken>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=1.1.2",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "mcp>=1.0,<2.0",
    "langchain>=1.3.9",
    "aiosqlite>=0.20",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pytest-cov>=7.1.0",
]
bench = [
    "chromadb>=1.5",
    "boto3>=1.34",
]
observability = [
    "weave>=0.52.43",
]

[project.scripts]
landscape = "landscape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# qdrant-client pulls protobuf unbounded (-> 7.x). Modern opentelemetry-proto
# caps protobuf<7, so an unconstrained resolve backtracks opentelemetry-proto to
# 1.11.1 (2022) whose generated _pb2.py is runtime-incompatible with protobuf 7
# ("Descriptors cannot be created directly"). Capping protobuf<7 lets the
# resolver pick modern opentelemetry-proto for both the chromadb and weave
# (observability) dependency chains. No package in the tree requires protobuf>=7.
#
# Security floors for transitive deps (Dependabot). These are not direct
# dependencies, so we force the patched versions via constraints rather than
# adding them to [project.dependencies]. Drop an entry once a direct dep's own
# floor already pulls the fixed version.
constraint-dependencies = [
    "protobuf<7",
    "pyjwt>=2.13.0",          # JWK/HMAC confusion, JWKS SSRF, DoS
    "cryptography>=48.0.1",   # vulnerable OpenSSL in wheels
    "urllib3>=2.7.0",         # cross-origin header leak + decompression bomb
    "python-multipart>=0.0.31",  # multipart/querystring DoS + smuggling
    "langsmith>=0.8.18",      # arbitrary file read + untrusted manifest deser
    "idna>=3.15",             # idna.encode() CVE-2024-3651 bypass
]

[tool.hatch.build.targets.wheel]
packages = ["src/landscape"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "extraction: slow tests that exercise real LLM extraction quality",
    "retrieval: slow tests that exercise hybrid retrieval over the killer-demo corpus",
    "unit: fast tests with no external services",
    "smoke: lightweight repo-safe surface tests suitable for CI",
    "integration: tests that require local services or stack-backed behavior",
    "external: tests that require optional dependencies, models, or heavyweight environments",
]
