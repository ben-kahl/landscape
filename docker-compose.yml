x-app-base: &app-base
  build: .
  ports:
    - "8000:8000"
  volumes:
    - ./src:/app/src
    - landscape_auth_data:/var/lib/landscape
  env_file:
    - .env
  environment:
    AUTH_DB_PATH: /var/lib/landscape/auth.db
    MCP_ISSUER_URL: "http://localhost:8000"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    - neo4j
    - qdrant

services:
  neo4j:
    image: neo4j:2026.03.1
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/landscape-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
      NEO4J_db_checkpoint_interval_time: "15m"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  llama-server-nvidia:
    profiles: ["gpu-nvidia"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # --no-mmproj: the GGUF repo ships a vision projector that -hf auto-loads,
    # burning ~1.1GB VRAM on the 8GB RTX 2080 for a text-only extraction workload.
    # --n-predict: server-side generation ceiling so callers that omit max_tokens
    # (curl, MCP) can't run the GPU away; the app client overrides per-request.
    command: >
      -hf unsloth/Qwen3.5-9B-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080
      --n-gpu-layers -1
      --ctx-size ${LLAMA_CTX_SIZE:-16384}
      --parallel 1
      --no-mmproj
      --n-predict ${LLAMA_N_PREDICT:-4096}
      --alias Qwen3.5-9B-Q4_K_M
    environment:
      # llama.cpp -hf downloads via the HF hub; without a token HF throttles
      # anonymous pulls to a crawl. Interpolated from .env.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      # llama.cpp -hf caches under the HF hub dir, NOT ~/.cache/llama.cpp, so the
      # volume must mount here or the model re-downloads on every recreate.
      - llama_models:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - llama-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    profiles: ["cpu", "gpu-amd", "host"]
    <<: *app-base

  app-gpu:
    profiles: ["gpu-nvidia"]
    <<: *app-base
    networks:
      default:
        aliases:
          - app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  neo4j_data:
  qdrant_storage:
  llama_models:
    name: landscape_llama_models
  landscape_auth_data:
